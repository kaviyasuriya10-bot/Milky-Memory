<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MilkyMemory</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="toast"></div><section id="auth"><div class="authbox"><div class="star">✦</div><h1>MilkyMemory</h1><p>Your memories among the stars.</p><div class="tabs"><button class="active" data-tab="login">Log in</button><button data-tab="register">Create account</button></div>
<form id="login"><input id="lu" placeholder="Username" required><input id="lp" type="password" placeholder="Password" required><button>Enter the galaxy</button></form>
<form id="register" class="hide"><input id="ru" placeholder="Username" minlength="3" required><input id="rp" type="password" placeholder="Password (6+ chars)" minlength="6" required><button>Create my galaxy</button></form></div></section>
<div id="app" class="hide"><aside><h2>✦ MilkyMemory</h2><button data-sec="galaxy" class="nav active">◉ Galaxy</button><button data-sec="timeline" class="nav">◷ Timeline</button><button data-sec="albums" class="nav">▦ Albums</button><button data-sec="tags" class="nav"># Tags</button><button data-sec="search" class="nav">⌕ Search</button><button data-sec="stats" class="nav">↗ Stats</button><div class="bottom"><button id="theme">☾ Theme</button><button id="logout">↪ Log out</button></div></aside>
<main><header><div><h2 id="title">Your Galaxy</h2><p id="sub">Every star is a memory.</p></div><div><button id="add">＋ Add memory</button><span class="user" id="who"></span></div></header>
<section id="galaxy" class="sec"><div id="space"><small>Click a star to open a memory</small></div><div class="quick"><b id="mc">0</b> Memories <b id="tc">0</b> Tags <b id="yc">0</b> Years</div></section>
<section id="timeline" class="sec hide"></section><section id="albums" class="sec hide"></section><section id="tags" class="sec hide"></section><section id="search" class="sec hide"><input id="q" class="search" placeholder="Search memories…"><div id="results"></div></section><section id="stats" class="sec hide"></section></main></div>
<div id="modal" class="modal hide"><div class="box"><button class="x" data-close>×</button><h2 id="mt">Add memory</h2><form id="memoryForm"><input type="hidden" id="mid"><label>Title<input id="mTitle" required></label><div class="two"><label>Date<input id="mDate" type="date" required></label><label>Color<input id="mColor" type="color" value="#a78bfa"></label></div><label>Description<textarea id="mDesc" rows="5"></textarea></label><label>Tags<input id="mTags" placeholder="friends, summer, school"></label><label>Photo<input id="mImage" type="file" accept="image/*"></label><div class="actions"><button type="button" id="del" class="danger hide">Delete</button><span></span><button>Save</button></div></form></div></div>
<script src="/app.js"></script></body></html>
